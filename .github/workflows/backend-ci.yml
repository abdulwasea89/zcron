name: Production checks

on:
  push:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - name: Install Python
        run: uv python install ${{ matrix.python-version }}
      - name: Install receipt image processing tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends imagemagick
      - name: Install locked dependencies
        run: uv sync --locked --python ${{ matrix.python-version }} --group dev
      - name: Lint backend
        run: uv run --frozen ruff check app tests
      - name: Run backend unit and integration tests
        env:
          APP_ENV: test
          DEBUG: "false"
          SECRET_KEY: ci-only-not-a-production-secret
          LOCAL_DATABASE_URL: "sqlite+aiosqlite:///:memory:"
          USE_CLOUD_DB: "no"
          STRIPE_SECRET_KEY: ""
          STRIPE_WEBHOOK_SECRET: ""
        run: uv run --frozen pytest -q

  frontend:
    name: Frontend production build and smoke checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked dependencies
        run: npm ci
      - name: Lint frontend
        run: npm run lint
      - name: Verify offline payment queue
        run: node --experimental-strip-types lib/offline-mutations.test.mjs
      - name: Type-check frontend
        run: npx tsc --noEmit --incremental false
      - name: Build production frontend
        env:
          NEXT_PUBLIC_API_URL: http://127.0.0.1:8000
        run: npm run build
      - name: Start and smoke-test production server
        env:
          NEXT_PUBLIC_API_URL: http://127.0.0.1:8000
        run: |
          npm run start -- --hostname 127.0.0.1 --port 3100 > /tmp/acron-next.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:3100/login >/dev/null; then break; fi
            sleep 2
          done
          node scripts/production-smoke.mjs
