[project]
name = "gym-platform-backend"
version = "0.1.0"
description = "Gym Operations Platform — multi-tenant SaaS backend (FastAPI)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "sqlalchemy>=2.0",
    "alembic>=1.14",
    "asyncpg>=0.30",
    "pydantic[email]>=2.10",
    "pydantic-settings>=2.7",
    "python-jose[cryptography]>=3.3",
    "cryptography>=43.0",
    "passlib[argon2]>=1.7",
    "stripe>=11.0",
    "celery[redis]>=5.4",
    "redis>=5.2",
    "httpx>=0.28",
    "python-multipart>=0.0.20",
    "sqlmodel>=0.0.38",
    "resend>=2.0",
    "jsonschema>=4.23",
    # Assistant agent runtime (ADR 018). LangGraph is the orchestration layer;
    # langchain-core supplies the message/tool/model interfaces; langchain-groq
    # is the swappable provider adapter (a factory in app/agent/model.py is the
    # only place that names it).
    "langgraph>=1.2",
    "langchain-core>=1.6",
    "langchain-groq>=1.1",
    # Durable checkpointing for human-in-the-loop in production. Dev/tests use
    # the in-memory saver, so this is only imported when a Postgres org runs.
    "langgraph-checkpoint-postgres>=3.1",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "ruff>=0.9",
    "mypy>=1.14",
    "aiosqlite>=0.22.1",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
